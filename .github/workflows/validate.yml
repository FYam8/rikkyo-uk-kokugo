name: Validate Rikkyo Kokugo scaffold

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/validate_scaffold.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_authority_baseline.py
